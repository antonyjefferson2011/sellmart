<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sellmart — Cursos e e-books</title>
  <link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="description" content="Vitrine digital da Sellmart: cursos e e-books de beleza, culinária, renda extra, marketing e mais.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sellmart.css">
<style>
header{position:sticky;top:0;z-index:20;background:#0B0F1Acc;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:68px;gap:16px}
.bar img{height:44px;width:auto;display:block}
.bar nav a{color:var(--mut);text-decoration:none;font-weight:500;padding:10px 4px}
.bar nav a:hover{color:var(--g)}
.hero{padding:64px 0 36px;text-align:center;background:radial-gradient(60% 80% at 50% 0,#7c3aed33,transparent 70%)}
.hero h1{font-size:clamp(30px,5.4vw,54px);line-height:1.1;font-weight:800;max-width:15em;margin:0 auto 16px}
.hero p{color:var(--mut);max-width:34em;margin:0 auto 28px;font-size:17px}
.search{max-width:560px;margin:0 auto;position:relative}
.search input{min-height:56px;padding-left:48px;border-radius:99px;font-size:16px;background:#0e1424}
.search svg{position:absolute;left:18px;top:18px;width:20px;height:20px;stroke:var(--pl);fill:none;stroke-width:2}
.chips{display:flex;gap:10px;overflow-x:auto;padding:8px 0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--g);font:500 15px "DM Sans",sans-serif;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--pl)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);font-weight:600}
.count{color:var(--mut);font-size:14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;padding-bottom:72px}
footer{border-top:1px solid var(--line);background:#080b14;padding:40px 0 28px;color:var(--mut);font-size:14.5px}
.fgrid{display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
.fgrid img{height:38px;margin-bottom:10px}
.fgrid h4{color:var(--g);margin-bottom:8px;font-size:15px}
.fgrid a{display:block;text-decoration:none;padding:5px 0}
.fgrid a:hover{color:var(--pl)}
.copy{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:13px}
@media(max-width:560px){.hero{padding:44px 0 26px}.grid{gap:16px}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a href="#top" aria-label="Sellmart — início"><img src="logo-sellmart.png" alt="Sellmart"></a>
    <nav><a href="#produtos">Produtos</a></nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <h1>Aprenda algo novo hoje, no seu ritmo</h1>
      <p>Cursos e e-books selecionados para você aprender, empreender e criar renda. Escolha, clique em comprar e comece.</p>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar cursos e e-books" aria-label="Buscar produtos" autocomplete="off">
      </label>
    </div>
  </section>

  <section class="wrap" id="produtos">
    <div class="chips" id="chips" role="group" aria-label="Categorias"></div>
    <p class="count" id="count" aria-live="polite"></p>
    <div id="estado"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="fgrid" id="rodape"></div>
    <p class="copy">© <span id="ano"></span> Sellmart. Todos os direitos reservados. As compras são finalizadas em páginas de pagamento externas.</p>
  </div>
</footer>

<script type="module">
import { firebaseConfig, CATEGORIAS, SITE, configurado } from "./config.js";
import { h, safeUrl, norm, productCard } from "./util.js";

const $ = (id) => document.getElementById(id);
let todos = [], cat = "Todos", busca = "";

/* ---------- rodapé ---------- */
$("ano").textContent = new Date().getFullYear();
(function rodape() {
  const r = $("rodape");
  r.append(h("div", {}, h("img", { src: "logo-sellmart.png", alt: "Sellmart" }),
    h("p", {}, "Vitrine digital de cursos e e-books.")));
  const contato = [];
  if (SITE.email) contato.push(h("a", { href: "mailto:" + SITE.email }, SITE.email));
  if (/^\d{10,15}$/.test(SITE.whatsapp)) contato.push(h("a", { href: "https://wa.me/" + SITE.whatsapp, target: "_blank", rel: "noopener noreferrer" }, "WhatsApp"));
  if (contato.length) r.append(h("div", {}, h("h4", {}, "Contato"), ...contato));
  const pol = [["Privacidade", SITE.privacidade], ["Termos de uso", SITE.termos], ["Reembolso", SITE.reembolso]]
    .filter(([, u]) => safeUrl(u))
    .map(([t, u]) => h("a", { href: safeUrl(u), target: "_blank", rel: "noopener noreferrer" }, t));
  if (pol.length) r.append(h("div", {}, h("h4", {}, "Políticas"), ...pol));
})();

/* ---------- estados ---------- */
function estado(tipo, titulo, texto, acao) {
  const e = $("estado");
  e.replaceChildren();
  if (!tipo) return;
  const box = h("div", { class: "state" + (tipo === "erro" ? " err" : "") });
  if (tipo === "carregando") box.append(h("div", { class: "spin" }), h("p", {}, "Carregando produtos…"));
  else {
    box.append(h("h3", {}, titulo), h("p", {}, texto));
    if (acao) box.append(h("button", { class: "btn ghost", onclick: acao }, "Tentar de novo"));
  }
  e.append(box);
}

/* ---------- categorias ---------- */
function chips() {
  const c = $("chips");
  c.replaceChildren(...["Todos", ...CATEGORIAS].map((n) =>
    h("button", { class: "chip", type: "button", "aria-pressed": String(n === cat), onclick: () => { cat = n; chips(); render(); } }, n)));
}

/* ---------- lista ---------- */
function render() {
  const q = norm(busca);
  const lista = todos.filter((p) =>
    (cat === "Todos" || p.categoria === cat) &&
    (!q || norm(p.nome + " " + p.descricao + " " + p.categoria).includes(q)));
  $("grid").replaceChildren(...lista.map((p, i) => productCard(p, i)));
  $("count").textContent = lista.length ? `${lista.length} ${lista.length === 1 ? "produto" : "produtos"}` : "";
  if (!lista.length) {
    todos.length
      ? estado("vazio", "Nada encontrado", "Tente outro termo ou escolha outra categoria.")
      : estado("vazio", "Novos produtos em breve", "Ainda não há produtos publicados. Volte logo!");
  } else estado(null);
}

$("q").addEventListener("input", (e) => { busca = e.target.value; render(); });
chips();
estado("carregando");

/* ---------- Firebase (leitura em tempo real, somente publicados) ---------- */
if (!configurado()) {
  estado("erro", "Site ainda não configurado", "Preencha a seção CONFIGURAÇÃO FIREBASE no arquivo config.js.");
} else {
  try {
    const [{ initializeApp }, { getFirestore, collection, query, where, onSnapshot }] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
    ]);
    const db = getFirestore(initializeApp(firebaseConfig));
    onSnapshot(
      query(collection(db, "produtos"), where("publicado", "==", true)),
      (snap) => {
        todos = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.criadoEm?.seconds || 0) - (a.criadoEm?.seconds || 0));
        render();
      },
      (err) => {
        console.error(err);
        estado("erro", "Não foi possível carregar os produtos", "Verifique sua conexão com a internet e tente novamente.", () => location.reload());
      }
    );
  } catch (err) {
    console.error(err);
    estado("erro", "Falha de conexão", "Não conseguimos carregar o serviço de dados. Tente novamente em instantes.", () => location.reload());
  }
}
</script>
</body>
</html>
